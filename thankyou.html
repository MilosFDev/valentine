<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="thankyou-body">

  <div class="thankyou-card">

    <h1>She said YES 💘</h1>

    <!-- VIDEO -->
    <video
      id="jojoVideo"
      class="jojo-video"
      muted
      loop
      playsinline>
      <source src="0203.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- TEXT -->
    <p class="message">
      This may look like just a website,<br>
      but it’s really me saying<br>
      <strong>thank you for choosing me.</strong>
    </p>

    <!-- BUTTON -->
    <button class="continue-btn" onclick="goNext()">Continue 💌</button>

  </div>

  <!-- SCRIPT -->
  <script>
    // play video after 1 second
    setTimeout(() => {
      const video = document.getElementById("jojoVideo");
      if (video) {
        video.play();
      }
    }, 1000);

    function goNext() {
      window.location.href = "reasons.html"; // promijeni ako treba
    }
  </script>

</body>
</html>
