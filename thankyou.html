<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You ❤️</title>
  <link rel="stylesheet" href="thankyou.css" />
</head>
<body>

  <!-- Sound Gate -->
  <div id="soundGate" class="sound-gate">
    <h1>🔊 Sound on?</h1>
    <p>This moment is better with sound</p>
    <button onclick="enableSound()">Tap to continue 💖</button>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="container hidden">
    
    <div class="card">
      
      <!-- Video (gif-like) -->
      <video
        id="jojoVideo"
        src="0203.mp4"
        muted
        playsinline
      ></video>

      <!-- Text -->
      <h1>Thank you ❤️</h1>
      <p>
        Thank you for saying yes.  
        It truly means more to me than I can put into words.
      </p>

    </div>

  </div>

  <script>
    function enableSound() {
      const video = document.getElementById("jojoVideo");
      document.getElementById("soundGate").style.display = "none";
      document.getElementById("mainContent").classList.remove("hidden");

      video.muted = false;
      video.volume = 0.3;
      video.play();
    }
  </script>

</body>
</html>
