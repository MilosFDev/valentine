<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You ❤️</title>
  <link rel="stylesheet" href="thankyou.css" />
</head>
<body>

  <!-- Sound Gate -->
  <div id="soundGate" class="sound-gate">
    <h1>🔊Ukljucite zvuk?</h1>
    <p>Molim Vas odobrite zvuk :) </p>
    <button onclick="enableSound()">YES YES YES</button>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="container hidden">
    
    <div class="card">
      
      <!-- Video (gif-like) -->
      <video
        id="jojoVideo"
        src="0203.mp4"
        muted
        playsinline
      ></video>

      <!-- Text -->
      <h1>Hvala Vam❤️</h1>
      <p>
        Zahvaljujem Vam se na pozitivnom odgovoru na moju propoziciju. 
      </p>
      <p>Voli vas puno,</p>
      <p>Losmi</p>


    </div>

  </div>

  <script>
    function enableSound() {
      const video = document.getElementById("jojoVideo");
      document.getElementById("soundGate").style.display = "none";
      document.getElementById("mainContent").classList.remove("hidden");

      video.muted = false;
      video.volume = 0.3;
      video.play();
    }
  </script>

</body>
</html>
